# 三条质量闸门。任何一条红，PR 不得合并（AGENTS.md §1.3 / §4.1）。
#
# 集成测试需要真实的 Qdrant + Neo4j，因此这里用 service containers 起一套。
# 没有它们时 tests/test_rag_llama.py 里的集成用例会自动 skip —— 那会让
# 「测试通过」失去意义，所以宁可多花一分钟把服务起起来。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消旧的运行，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      qdrant:
        # 与 pyproject.toml 的 qdrant-client 版本对齐（minor 差不得超过 1）
        image: qdrant/qdrant:v1.17.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/${{ vars.CI_NEO4J_PASSWORD || 'ci-test-password' }}
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${{ vars.CI_NEO4J_PASSWORD || 'ci-test-password' }}
      QDRANT_URL: http://localhost:6333
      # 集成用例走 FakeEmbedding，不需要真实 ZHIPU_API_KEY
      ZHIPU_API_KEY: ""
      DEEPSEEK_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # 立刻确认闸门工具真的在。pip < 25.1 会**静默忽略** PEP 735 的
          # dependency-groups：装完不报错，但 ruff 根本没装上，要等到第一条
          # 闸门才炸（本项目真实踩过，见 pyproject.toml 的注释）。
          python -m ruff --version
          python -m pytest --version

      - name: 闸门 1/3 · 静态检查
        run: python -m ruff check src tests scripts

      - name: 闸门 2/3 · 密钥扫描
        # 扫描将要提交的文件；--all 会连被忽略的文件一起扫，
        # 本地 .env 不存在时等价。CI 里用默认模式即可。
        run: python scripts/check_secrets.py

      - name: 闸门 3/3 · 测试
        run: python -m pytest tests -q

      - name: 确认集成用例真的跑了（而不是被 skip）
        # 真实语料属于业务数据、不进版本库，所以这里盯的是**合成语料**的端到端
        # 用例：它永远有数据可用，被 skip 就只可能是 Qdrant / Neo4j 没就绪。
        # 服务起不来时集成用例会静默 skip，那样 CI 就是假绿。
        run: |
          python -m pytest tests/test_rag_llama.py -q -rs \
            -k "end_to_end_on_synthetic_corpus" | tee /tmp/integration.txt
          if grep -q "skipped" /tmp/integration.txt; then
            echo "::error::集成测试被跳过 —— Qdrant / Neo4j 服务可能没有就绪"
            exit 1
          fi
