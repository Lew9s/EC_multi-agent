[project]
name = "ec-renew"
version = "0.1.0"
description = "Engineering change proposal generation (lab demo)"
requires-python = ">=3.11"
# 注：本机默认的 pip 镜像（清华）不通，装依赖要显式指定官方源：
#   python -m pip install -i https://pypi.org/simple -e ".[dev]"
#
# 版本组合是实测过的：llama-index-vector-stores-qdrant 必须 >=0.8，
# 否则它会 import qdrant-client 1.15+ 已经删掉的 IDF_EMBEDDING_MODELS。
dependencies = [
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "neo4j>=5.28,<7",
    # ---- RAG (LlamaIndex + 智谱 embedding + Qdrant) ----
    "llama-index-core>=0.14,<0.15",
    "llama-index-vector-stores-qdrant>=0.10,<0.11",
    # qdrant-client 的 minor 与 Qdrant 服务端最多差 1，否则客户端会告警；
    # docker-compose.yml 里钉的镜像版本要与此保持同步。
    "qdrant-client>=1.17,<1.18",
]

[dependency-groups]
# ruff 放进 dev：它是 AGENTS.md §1.3 的三条闸门之一，
# 本地与 CI 必须用同一套工具，否则「本地绿、CI 红」会变成常态。
dev = ["pytest>=7.4,<9", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ec_renew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 集成用例在服务不可用时会 skip。CI 里由 workflow 额外拦一道，
# 防止「服务没起来」被当成「测试通过」。见 .github/workflows/ci.yml。
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# 刻意不写 [tool.ruff.lint].select：收紧规则集会让既有文件大面积报错，
# 属于独立变更，应在专门 PR 里讨论并一次性清理（AGENTS.md §7.5）。